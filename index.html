<!doctype html><html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>관세사 1차 출제빈도 탐색기</title>
<style>
:root{--navy:#1f3a5f;--blue:#2c5f8a;--crim:#a31821;--gray:#6b6b6b;--bg:#f4f6f9;--card:#fff;--line:#e2e8f0}
@media(prefers-color-scheme:dark){:root{--bg:#0f1622;--card:#182233;--line:#28374d;--gray:#9fb0c5}body{color:#e7edf5}}
*{box-sizing:border-box}body{margin:0;font-family:"맑은 고딕","Malgun Gothic",system-ui,sans-serif;background:var(--bg);color:#1b2430}
header{background:var(--navy);color:#fff;padding:16px 16px 10px;position:sticky;top:0;z-index:5}
h1{margin:0;font-size:19px}.sub{font-size:12px;opacity:.8;margin-top:3px}
.total{font-size:13px;font-weight:700;margin-top:6px;color:#ffd98a}
.tabs{display:flex;gap:6px;margin-top:12px}
.tab{flex:1;padding:9px 6px;border:0;border-radius:8px 8px 0 0;background:#33507a;color:#cfe0f2;font-size:15px;font-weight:700;cursor:pointer}
.tab.on{background:var(--card);color:var(--navy)}
.ctrl{background:var(--card);padding:10px 12px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;border-bottom:1px solid var(--line);position:sticky;top:118px;z-index:4}
.ctrl input,.ctrl select{padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:inherit;font-size:14px}
.ctrl input{flex:1;min-width:120px}
.ctrl input[type=checkbox]{flex:none;min-width:0}
.prog{padding:8px 14px;font-size:13px;color:var(--gray);background:var(--card)}
.bar{height:7px;background:var(--line);border-radius:4px;overflow:hidden;margin-top:4px}
.bar>i{display:block;height:100%;background:var(--blue);width:0}
ul{list-style:none;margin:0;padding:8px 10px 60px}
li{background:var(--card);border:1px solid var(--line);border-radius:10px;margin:7px 0;padding:10px 12px;display:flex;gap:10px;align-items:flex-start}
li.done{opacity:.5}
li input[type=checkbox]{width:22px;height:22px;margin-top:2px;flex:none}
.mid{flex:1;min-width:0}
.top{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.art{font-size:17px;font-weight:800;color:var(--navy)}
@media(prefers-color-scheme:dark){.art{color:#7fa8d6}}
.grp{font-size:12px;color:var(--gray)}
.freq{margin-left:auto;font-weight:800;color:var(--crim);font-size:15px;white-space:nowrap}
.det{font-size:12px;color:var(--gray);margin-top:4px;line-height:1.5;word-break:break-all}
.star{flex:none;background:none;border:0;font-size:22px;line-height:1;cursor:pointer;color:#b8c2cf;padding:0 2px}
.star.on{color:#e0a800}
.btn{padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:inherit;font-size:13px;font-weight:700;cursor:pointer;white-space:nowrap}
.btn.on{background:var(--crim);border-color:var(--crim);color:#fff}
li.hasq{cursor:pointer}
li.hasq .qpanel{cursor:auto}
.qtag{font-size:11px;font-weight:700;color:var(--blue);border:1px solid var(--line);border-radius:10px;padding:1px 7px;white-space:nowrap}
@media(prefers-color-scheme:dark){.qtag{color:#7fa8d6}}
.qpanel{margin-top:8px;display:flex;flex-direction:column;gap:8px}
.qcard{border:1px solid var(--line);border-radius:8px;padding:10px;background:var(--bg);font-size:14px;line-height:1.55}
.qno{font-size:12px;font-weight:800;color:var(--navy);margin-bottom:4px}
@media(prefers-color-scheme:dark){.qno{color:#7fa8d6}}
.qq{font-weight:700;margin-bottom:6px}
.qpas{white-space:pre-line;font-size:13px;border-left:3px solid var(--line);padding:4px 8px;margin-bottom:6px;color:inherit;opacity:.9}
.qopt{padding:4px 8px;border-radius:6px;margin:2px 0;font-size:13px;border:1px solid transparent}
.qopt.wrong{border-color:#A31821;color:#A31821;background:rgba(163,24,33,.08)}
.qretry{font-size:13px;color:var(--gray);margin-top:6px;text-align:right}
.qopt.ans{background:#e3f4e8;color:#1e6b36;font-weight:700;border:1px solid #9fd3ae}
@media(prefers-color-scheme:dark){.qopt.ans{background:#173a24;color:#8fe0a8;border-color:#2c6b41}}
.qwhy{margin-top:6px}
.qwhy>summary{cursor:pointer;font-weight:800;color:var(--crim);font-size:13px}
@media(prefers-color-scheme:dark){.qwhy>summary{color:#ff7b84}}
.qwhy>div{white-space:pre-line;font-size:13px;margin-top:4px;padding:6px 8px;border-left:3px solid var(--crim)}
.qnone{font-size:12px;color:var(--gray)}
.empty{text-align:center;color:var(--gray);padding:40px 12px}
</style></head><body>
<header>
<h1>관세사 1차 · 출제빈도 탐색기</h1>
<div class="sub">기출 28~43회 · 어느 조문이 몇 번 나왔나 → 빈출부터 공부</div>
<div class="total" id="total"></div>
<div class="tabs" id="tabs"></div>

<label style="font-size:13px;display:flex;align-items:center;gap:4px"><input type="checkbox" id="staronly" style="width:16px;height:16px">★만 보기</label>

</div>
<div class="prog"><span id="pt"></span><div class="bar"><i id="pi"></i></div></div>
<ul id="list"></ul>

 document.getElementById('pt').textContent=`완료 ${dn} / ${tot}  (${tot?Math.round(dn/tot*100):0}%) · 표시 ${arr.length}건${todayMode?' · 📌 오늘 볼 20개(미완료 빈출순)':''}`;
 let T=0,D=0;for(const s of SUBS){T+=DATA[s].length;D+=DATA[s].filter(d=>done[key(s,d)]).length}
 document.getElementById('total').textContent=`전체 3과목 진도: ${D} / ${T} (${T?Math.round(D/T*100):0}%)`;
 document.getElementById('pi').style.width=(tot?dn/tot*100:0)+'%';
 list.innerHTML = arr.length? '' : '<div class="empty">해당 항목이 없어요</div>';
 for(const d of arr){
  const li=document.createElement('li');const k=key(cur,d);const ck=!!done[k];if(ck)li.className='done';
  li.innerHTML=`<input type=checkbox ${ck?'checked':''}><div class=mid><div class=top><span class=art></span><span class=grp></span><span class=freq>${d.f}회</span></div><div class=det></div></div><button class="star${star[k]?' on':''}" title="별표">${star[k]?'★':'☆'}</button>`;
  li.querySelector('.art').textContent=d.a;li.querySelector('.grp').textContent=d.g;li.querySelector('.det').textContent=d.d;
  li.querySelector('input').onchange=e=>{if(e.target.checked)done[k]=1;else delete done[k];localStorage.setItem('cq_done',JSON.stringify(done));render()};
  const qk=qkeys(d),hasQ=qk.some(x=>QD[x]);
  if(hasQ){li.classList.add('hasq');const t=document.createElement('span');t.className='qtag';t.textContent=(openQ.has(k)?'▴':'▾')+' 문제 '+qk.filter(x=>QD[x]).length;li.querySelector('.top').insertBefore(t,li.querySelector('.freq'));
   li.onclick=e=>{if(e.target.closest('input,button,.qpanel'))return;openQ.has(k)?openQ.delete(k):openQ.add(k);render()};
   if(openQ.has(k))li.querySelector('.mid').appendChild(qPanel(qk))}
  li.querySelector('.star').onclick=()=>{if(star[k])delete star[k];else star[k]=1;localStorage.setItem('cq_star',JSON.stringify(star));render()};
  list.appendChild(li);
 }
}
document.getElementById('exp').onclick=()=>{
 const blob=new Blob([JSON.stringify({cq_done:done,cq_star:star},null,1)],{type:'application/json'});
 const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='customs-freq-진도-'+new Date().toLocaleDateString('sv')+'.json';
 document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};
const impFile=document.getElementById('impfile');
document.getElementById('imp').onclick=()=>impFile.click();
impFile.onchange=async()=>{
 const f=impFile.files[0];impFile.value='';if(!f)return;
 try{
  const o=JSON.parse(await f.text());const ok=v=>v&&typeof v=='object'&&!Array.isArray(v);
  if(!ok(o)||!ok(o.cq_done)||(o.cq_star!==undefined&&!ok(o.cq_star)))throw new Error('형식이 맞지 않아요');
  for(const [obj,src,name] of [[done,o.cq_done,'cq_done'],[star,o.cq_star||{},'cq_star']]){Object.keys(obj).forEach(k=>delete obj[k]);for(const k in src)if(src[k])obj[k]=1;localStorage.setItem(name,JSON.stringify(obj))}
  render();alert(`복원 완료: 완료 ${Object.keys(done).length}개 · 별표 ${Object.keys(star).length}개`);
 }catch(e){alert('가져오기 실패: '+e.message)}
};
fillGrp();render();
const ctrlEl=document.querySelector('.ctrl'),hdr=document.querySelector('header');
const fixTop=()=>{ctrlEl.style.top=hdr.offsetHeight+'px'};fixTop();addEventListener('resize',fixTop);
</script></body></html>
